# Portable school subset of ../tmux/.tmux.conf. No TPM/network bootstrap or Pi.
set -g default-shell /usr/bin/zsh
set -g default-terminal screen-256color
set -ga terminal-overrides ',*:E3='
set -g status-position top
set -g status-bg colour235
set -g status-fg white
set -g status-left '[#{session_name}] '
set -g status-right '%H:%M %d-%b-%y'
set -g mouse on
set -g extended-keys off
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g detach-on-destroy off
set -g history-limit 1000000
setw -g mode-keys vi
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on
set -as terminal-features ',xterm-256color:clipboard'
# Match the Neovim pane-navigation keys, forwarding them when inside Neovim.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(.*/)?(g?vim|nvim)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n C-Up resize-pane -U 2
bind -n C-Down resize-pane -D 3
bind -n C-Left resize-pane -L 2
bind -n C-Right resize-pane -R 3
bind x kill-pane
bind ';' command-prompt
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind Up switch-client -p
bind Down switch-client -n
bind -T choose-tree j send-keys Down
bind -T choose-tree k send-keys Up
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection
unbind -T copy-mode-vi Space
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down
bind v display-popup -E -w 100% -h 98% '$HOME/my-vim-env/tmux/scripts/window-picker.sh'
