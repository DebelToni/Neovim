# Blink hardware-keyboard mappings migrated to rootshell/Ghostty.
# Import in rootshell: Settings → Terminal → Keyboard Shortcuts → Load Config File.

# Cmd+1…9: send the Ctrl+A tmux prefix, then select window 1…9.
keybind = cmd+1=text:\x011
keybind = cmd+2=text:\x012
keybind = cmd+3=text:\x013
keybind = cmd+4=text:\x014
keybind = cmd+5=text:\x015
keybind = cmd+6=text:\x016
keybind = cmd+7=text:\x017
keybind = cmd+8=text:\x018
keybind = cmd+9=text:\x019

# Cmd+L: Blink hex 016C.
keybind = cmd+l=text:\x01l

# Preserve Blink's explicit non-Option CSI-u sequences.
# Option is handled globally by rootshell's "Option as Alt" setting.
keybind = ctrl+shift+bracket_left=text:\x1b[123;6u
keybind = ctrl+shift+bracket_right=text:\x1b[125;6u
keybind = ctrl+shift+j=text:\x1b[74;6u
keybind = ctrl+shift+t=text:\x1b[84;6u
